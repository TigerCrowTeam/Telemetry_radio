[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telemetry-radio"
version = "1.0.0"
description = "A modular MAVLink telemetry radio using SoapySDR"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["cryptography>=42", "numpy>=1.23", "PyYAML>=6.0", "pymavlink>=2.4", "reedsolo>=1.7"]

[project.optional-dependencies]
sdr = ["SoapySDR"]
test = ["pytest>=7"]
dev = [
    "build>=1.2",
    "mypy>=1.11",
    "pip-audit>=2.7",
    "pytest>=7",
    "pytest-cov>=5",
    "ruff>=0.6",
    "twine>=5.1",
    "types-PyYAML>=6.0",
]

[project.scripts]
telemetry-radio = "telemetry_radio.__main__:main"
telemetry-radio-status = "telemetry_radio.status_cli:main"
telemetry-radio-validate = "telemetry_radio.validate:main"
telemetry-radio-replay = "telemetry_radio.replay:main"
telemetry-radio-keys = "telemetry_radio.key_cli:main"
telemetry-radio-conformance = "telemetry_radio.conformance:main"
telemetry-radio-deployment-check = "telemetry_radio.deployment_check:main"
telemetry-radio-demo = "telemetry_radio.demo_monitor:main"

[tool.setuptools.packages.find]
include = ["telemetry_radio*"]

[tool.setuptools.data-files]
"share/telemetry-radio/fixtures" = ["fixtures/protocol_v4.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.coverage.run]
branch = true
source = ["telemetry_radio"]

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.10"
files = ["telemetry_radio"]
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_configs = true
show_error_codes = true
no_site_packages = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pymavlink.*", "SoapySDR"]
ignore_missing_imports = true
